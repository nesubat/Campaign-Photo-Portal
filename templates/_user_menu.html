<div class="user-menu">
  <button type="button" class="user-menu-trigger" aria-haspopup="true" aria-expanded="false">
    <span class="user-menu-icon">👤</span>
    <span class="user-menu-name">{{ current_user.name }}</span>
    <span class="user-menu-caret">▾</span>
  </button>
  <div class="user-menu-dropdown hidden">
    {% if current_user.role == 'admin' %}
    <a href="/admin" class="user-menu-item">Admin</a>
    {% endif %}
    <a href="/change-pin" class="user-menu-item">Change PIN</a>
    <form method="post" action="/logout" class="inline-form">
      <button type="submit" class="user-menu-item user-menu-item-btn">Log out</button>
    </form>
  </div>
</div>
